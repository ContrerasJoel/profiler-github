services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: profiler-github-api
    container_name: profiler-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      # Expuesto en el host para que Nginx Proxy Manager lo publique con SSL.
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
